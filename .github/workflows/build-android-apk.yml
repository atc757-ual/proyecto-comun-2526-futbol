name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build Stencil Library
        run: |
          npm install --no-package-lock
          npm run build
        working-directory: ./stencil-library

      - name: Install dependencies
        run: npm install --no-package-lock
        working-directory: ./frontend-angular-ionic

      - name: Build Angular app (production-android)
        run: npm run build -- --configuration=production-android
        working-directory: ./frontend-angular-ionic

      - name: Add Android platform
        run: npx cap add android
        working-directory: ./frontend-angular-ionic

      - name: Inject Android permissions into AndroidManifest.xml
        working-directory: ./frontend-angular-ionic
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let content = fs.readFileSync(path, 'utf8');
          const perms = \`
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\`;
          const marker = '<uses-permission android:name=\"android.permission.INTERNET\" />';
          if (!content.includes('ACCESS_FINE_LOCATION')) {
            content = content.replace(marker, marker + perms);
            fs.writeFileSync(path, content);
            console.log('Permissions injected successfully');
          } else {
            console.log('Permissions already present, skipping');
          }
          "

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: ./frontend-angular-ionic

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: ./frontend-angular-ionic/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug-${{ github.sha }}
          path: frontend-angular-ionic/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
