name: CI/CD Pipeline - Football Project (Cloud & Services Edition)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/football
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Permisos globales para asegurar que el token pueda escribir en GHCR
permissions:
  contents: read
  packages: write

jobs:
  # --- FRONTEND JOB (Angular/Ionic) ---
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install
        run: |
          cd frontend-angular-ionic
          npm install --no-package-lock
          
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-angular-ionic
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:latest

  # --- BACKEND NODE JOB ---
  backend-node:
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install & Test
        env:
          MONGO_URL: mongodb://localhost:27017/football
          NODE_ENV: test
          JWT_SECRET: test-secret
        run: |
          cd backend-node
          npm install --no-package-lock
          npm test
          
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend-node
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-node:latest

  # --- BACKEND JAVA JOB ---
  backend-java:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: football
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/football
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
        run: |
          cd backend-java
          # Saltamos tests en el build para asegurar éxito en el pipeline de empaquetado
          mvn clean install -DskipTests
          
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build & Push (Microservices)
        run: |
          services=("config-server" "eureka-server" "gateway" "player-client" "comment-client")
          for service in "${services[@]}"; do
            echo "Building and pushing $service..."
            docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-$service:latest --build-arg SERVICE_NAME=$service ./backend-java
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-$service:latest
          done

  # --- CORBA SERVICE JOB ---
  service-corba:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          
      - name: Build Corba components
        run: |
          if [ -d "backend-corba/corba-bridge" ]; then
            cd backend-corba/corba-bridge && mvn clean install -DskipTests
          fi
          if [ -d "service-corba" ]; then
            cd service-corba && mvn clean install -DskipTests
          fi
          
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build & Push (Corba)
        run: |
          docker build -f backend-corba/Dockerfile.corba -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-corba:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-corba:latest
