name: CI/CD Pipeline - Football Project (Pro Cloud Edition)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/football
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # --- FRONTEND JOB ---
  frontend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install
        run: |
          cd frontend-angular-ionic
          npm install --no-package-lock
          
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-angular-ionic
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:latest

  # --- BACKEND NODE JOB ---
  backend-node:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # Añadimos MongoDB como servicio para los tests
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install, Lint & Test
        env:
          MONGO_URL: mongodb://localhost:27017/football
          NODE_ENV: test
        run: |
          cd backend-node
          npm install --no-package-lock
          npm run lint --if-present
          npm test -- --watchAll=false
          
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend-node
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-node:latest

  # --- BACKEND JAVA JOB ---
  backend-java:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build with Maven (Skip Tests for now)
        run: |
          cd backend-java
          mvn clean install -DskipTests
          
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build & Push (Microservices)
        run: |
          services=("config-server" "eureka-server" "gateway" "player-client" "comment-client" "player-feign" "comment-feign")
          for service in "${services[@]}"; do
            echo "Building and pushing $service..."
            docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-$service:latest --build-arg SERVICE_NAME=$service ./backend-java
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-$service:latest
          done

  # --- CORBA SERVICE JOB ---
  service-corba:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          
      - name: Build
        run: |
          cd service-corba
          mvn clean install -DskipTests
          
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build & Push
        run: |
          cd service-corba
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-corba:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-corba:latest
