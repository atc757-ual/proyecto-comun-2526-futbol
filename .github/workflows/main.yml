name: CI/CD Pipeline - Football Project (Multi-Environment)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/football
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # --- FRONTEND JOB (Angular/Ionic) ---
  frontend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          
      - name: Build Stencil Library
        run: |
          cd stencil-library
          npm install --no-package-lock
          npm run build

      - name: Install
        run: |
          cd frontend-angular-ionic
          npm install --no-package-lock

      - name: Run Angular unit tests
        run: |
          cd frontend-angular-ionic
          npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend-angular-ionic/coverage/
          if-no-files-found: warn

      - name: Install Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox

      - name: Cypress E2E - Chrome
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6
        continue-on-error: true
        with:
          working-directory: frontend-angular-ionic
          browser: chrome
          install: false
          build: npx ng build --configuration=production
          start: node_modules/.bin/http-server dist/frontend-angular-ionic/browser -p 4200 --silent
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 120

      - name: Cypress E2E - Firefox
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6
        continue-on-error: true
        with:
          working-directory: frontend-angular-ionic
          browser: firefox
          install: false
          start: node_modules/.bin/http-server dist/frontend-angular-ionic/browser -p 4200 --silent
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 120

      - name: Upload Cypress results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cypress-results
          path: |
            frontend-angular-ionic/cypress/videos/
            frontend-angular-ionic/cypress/screenshots/
          if-no-files-found: warn

      - name: Log in to Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build & Push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./frontend-angular-ionic/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-frontend:latest
          no-cache: true

  # --- BACKEND NODE JOB ---
  backend-node:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          
      - name: Install & Test
        env:
          MONGO_URL: mongodb://localhost:27017/football
          NODE_ENV: test
          JWT_SECRET: test-secret
        run: |
          cd backend-node
          npm install --no-package-lock
          # Generar clave RSA temporal para los tests (private_key.pem está en .gitignore)
          openssl genrsa -out private_key.pem 2048
          openssl rsa -in private_key.pem -pubout -out public_key.pem
          npm test

      - name: Upload Node coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-coverage
          path: backend-node/coverage/
          if-no-files-found: warn

      - name: Log in to Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build & Push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend-node
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-node:latest
          no-cache: true

  # --- BACKEND JAVA JOB ---
  backend-java:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      pull-requests: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: football
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Test (JaCoCo)
        continue-on-error: true
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/football
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
        run: |
          cd backend-java
          mvn test -pl player-client,comment-client -am

      - name: Upload Java coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: java-coverage
          path: |
            backend-java/player-client/target/site/jacoco/
            backend-java/player-client/target/surefire-reports/
            backend-java/comment-client/target/site/jacoco/
            backend-java/comment-client/target/surefire-reports/
          if-no-files-found: warn

      - name: Build (package)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/football
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
        run: |
          cd backend-java
          mvn clean install -DskipTests

      - name: SonarCloud Scan (Java)
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/football
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
        run: |
          cd backend-java
          mvn sonar:sonar \
            -Dsonar.projectKey=football-java \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=player-client/target/site/jacoco/jacoco.xml \
            -DskipTests

      - name: Log in to Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build & Push (Microservices)
        run: |
          services=("config-server" "eureka-server" "gateway" "player-client" "comment-client" "external-client" "external-feign")
          for service in "${services[@]}"; do
            echo "Building and pushing $service..."
            docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-$service:latest --build-arg SERVICE_NAME=$service ./backend-java
            docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-$service:latest
          done

  # --- CORBA SERVICE JOB ---
  service-corba:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '11'
          distribution: 'temurin'
          
      - name: Test CORBA components
        continue-on-error: true
        run: |
          if [ -d "backend-corba/corba-bridge" ]; then
            cd backend-corba/corba-bridge && mvn test
            cd ../..
          fi
          if [ -d "backend-corba/service-corba" ]; then
            cd backend-corba/service-corba && mvn test
          fi

      - name: Upload CORBA test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: corba-test-results
          path: |
            backend-corba/corba-bridge/target/surefire-reports/
            backend-corba/service-corba/target/surefire-reports/
          if-no-files-found: warn

      - name: Build Corba components
        run: |
          if [ -d "backend-corba/corba-bridge" ]; then
            cd backend-corba/corba-bridge && mvn clean install -DskipTests
          fi
          if [ -d "backend-corba/service-corba" ]; then
            cd backend-corba/service-corba && mvn clean install -DskipTests
          fi

      - name: Log in to Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build & Push (Corba)
        run: |
          docker build -f backend-corba/Dockerfile.corba -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-corba:latest ./backend-corba
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-corba:latest

  # --- DEPLOY JOB (only on push to main) ---
  deploy:
    needs: [frontend, backend-node, backend-java, service-corba]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: REGISTRY_TOKEN,REGISTRY_USER
          script: |
            cd $HOME/proyecto-comun-2526-futbol
            git pull origin main
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
