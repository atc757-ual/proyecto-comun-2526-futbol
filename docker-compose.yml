services:
  # --- DATABASES ---
  db-node:
    image: mongo:latest
    container_name: football-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./backend-node/database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - football-network

  db-java:
    image: postgres:15
    container_name: football-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: football_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend-java/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - football-network

  # --- INFRASTRUCTURE MICROSERVICES ---
  config-server:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: config-server
    container_name: football-config-server
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config
    volumes:
      - ./springboot-config:/config
    ports:
      - "8888:8888"
    networks:
      - football-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  eureka-server:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: eureka-server
    container_name: football-eureka-server
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
    depends_on:
      - config-server
    networks:
      - football-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  gateway:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: gateway
    container_name: football-gateway
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      FIREBASE_SERVICE_ACCOUNT: "/app/firebase-credentials.json"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      SPRING_AI_GEMINI_API_KEY: "${GOOGLE_API_KEY}"
      # Forzamos la propiedad de Spring para LangChain4j
      SPRING_APPLICATION_JSON: '{"google":{"api":{"key":"${GOOGLE_API_KEY}"}}}'
      JWT_SECRET: "${JWT_SECRET:-esta-es-una-clave-secreta-muy-larga-y-segura-para-el-futbol-2526}"
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json
    depends_on:
      - config-server
      - eureka-server
    networks:
      - football-network

  # --- DATA MICROSERVICES ---
  player-client:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: player-client
    container_name: football-player-client
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://football-postgres:5432/football_db"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root"
      SERVER_PORT: 8081
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      db-java:
        condition: service_started
    networks:
      - football-network
    ports:
      - "8081:8081"

  comment-client:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: comment-client
    container_name: football-comment-client
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://football-postgres:5432/football_db"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root"
      SERVER_PORT: 8082
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      db-java:
        condition: service_started
    networks:
      - football-network
    ports:
      - "8082:8082"

  # --- ORCHESTRATION MICROSERVICES ---
  player-feign:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: player-feign
    container_name: football-player-feign
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      player-client:
        condition: service_started
    networks:
      - football-network

  comment-feign:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: comment-feign
    container_name: football-comment-feign
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      SERVER_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      comment-client:
        condition: service_started
    networks:
      - football-network

  # --- FRONTEND & OTHERS ---
  backend-node:
    build: ./backend-node
    container_name: football-backend-node
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://football-mongo:27017/football
      - PORT=3000
      - FIREBASE_SERVICE_ACCOUNT=/app/firebase-credentials.json
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-esta-es-una-clave-secreta-muy-larga-y-segura-para-el-futbol-2526}
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json
    depends_on:
      - db-node
    networks:
      - football-network

  frontend:
    build: ./frontend-angular-ionic
    container_name: football-frontend
    ports:
      - "8100:80"
    depends_on:
      backend-node:
        condition: service_started
      gateway:
        condition: service_started

  # 1. Servicio de Nombres CORBA
  corba-naming:
    image: eclipse-temurin:8-jre
    container_name: football-corba-naming
    command: orbd -ORBInitialPort 1050 -ORBInitialHost 0.0.0.0
    networks:
      - football-network

  # 2. Servidor CORBA
  corba-server:
    build:
      context: ./backend-corba
      dockerfile: Dockerfile.corba
    container_name: football-corba-server
    environment:
      - ORB_HOST=corba-naming
    depends_on:
      - corba-naming
    networks:
      - football-network

  # 3. Bridge HTTP-CORBA
  corba-bridge:
    build:
      context: ./backend-corba
      dockerfile: Dockerfile.bridge
    container_name: football-corba-bridge
    ports:
      - "8089:8080"
    environment:
      - ORB_HOST=corba-naming
      - FIREBASE_SERVICE_ACCOUNT=/app/firebase-credentials.json
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json
    depends_on:
      - corba-naming
      - corba-server
    networks:
      - football-network

networks:
  football-network:
    driver: bridge

volumes:
  mongo-data:
  postgres-data:
