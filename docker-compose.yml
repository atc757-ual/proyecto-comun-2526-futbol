services:
  # --- DATABASES ---
  db-node:
    image: mongo:4.4
    container_name: football-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - football-network
    healthcheck:
      test: [ "CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db-java:
    image: postgres:15
    container_name: football-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-football_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - football-network

  # --- INFRASTRUCTURE MICROSERVICES ---
  config-server:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: config-server
    container_name: football-config-server
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config
    volumes:
      - ./springboot-config:/config
    ports:
      - "8888:8888"
    networks:
      - football-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 150s

  eureka-server:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: eureka-server
    container_name: football-eureka-server
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
    depends_on:
      - config-server
    networks:
      - football-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 150s

  user-client:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: user-client
    container_name: football-user-client
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_APPLICATION_NAME: user-client
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://football-postgres:5432/${DB_NAME:-football_db}"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-root}"
      SERVER_PORT: 8083
      FIREBASE_SERVICE_ACCOUNT: "/app/firebase-credentials.json"
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      db-java:
        condition: service_started
    networks:
      - football-network
    ports:
      - "8083:8083"

  gateway:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: gateway
    container_name: football-gateway
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://football-config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://football-eureka-server:8761/eureka/"
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      FIREBASE_SERVICE_ACCOUNT: "/app/firebase-credentials.json"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      SPRING_AI_GEMINI_API_KEY: ${GOOGLE_API_KEY}
      SPRING_APPLICATION_JSON: '{"google":{"api":{"key":"${GOOGLE_API_KEY}"}}}'
      SPRING_CLOUD_GATEWAY_GRPC_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json
      - ./backend-java/private_key.pem:/app/private_key.pem
      - ./backend-java/public_key.pem:/app/public.key
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      user-client:
        condition: service_started
    networks:
      - football-network

  # --- DATA MICROSERVICES ---
  player-client:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: player-client
    container_name: football-player-client
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://football-postgres:5432/${DB_NAME:-football_db}"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-root}"
      SERVER_PORT: 8081
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      db-java:
        condition: service_started
    networks:
      - football-network
    ports:
      - "8081:8081"

  comment-client:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: comment-client
    container_name: football-comment-client
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://football-postgres:5432/${DB_NAME:-football_db}"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-root}"
      SERVER_PORT: 8082
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      db-java:
        condition: service_started
    networks:
      - football-network
    ports:
      - "8082:8082"

  # --- ORCHESTRATION MICROSERVICES ---
  external-client:
    build:
      context: ./backend-java
      args:
        SERVICE_NAME: external-client
    container_name: football-external-client
    environment:
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      FOOTBALL_API_KEY: "${FOOTBALL_API_KEY}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      TSDB_BASE_URL: "${TSDB_BASE_URL:-https://www.thesportsdb.com/api/v2/json}"
      SERVER_PORT: 8085
      CORBA_BRIDGE_URL: "http://corba-bridge:8080/corba-bridge/api/noticias"
    ports:
      - "8085:8085"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      player-client:
        condition: service_started
    networks:
      - football-network

  # --- FRONTEND & OTHERS ---
  backend-node:
    build: ./backend-node
    container_name: football-backend-node
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGO_URL=mongodb://football-mongo:27017/football
      - PORT=3000
      - FIREBASE_SERVICE_ACCOUNT=/app/firebase-credentials.json
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL_NODE:-gemini-3.5-flash}
      - JWT_SECRET=${JWT_SECRET}
      - TSDB_API_KEY=${FOOTBALL_API_KEY}
      - CORBA_BRIDGE_URL=http://corba-bridge:8080/corba-bridge/api/noticias
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - STATUS_API_KEY=${STATUS_API_KEY}
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json
      - ./backend-node/private_key.pem:/app/private_key.pem
      - ./backend-node/public_key.pem:/app/public_key.pem
    depends_on:
      db-node:
        condition: service_healthy
    networks:
      - football-network

  frontend:
    build:
      context: .
      dockerfile: frontend-angular-ionic/Dockerfile
    container_name: football-frontend
    # En local: usa ports. En VM con nginx-proxy: comenta ports y descomenta expose
    # ports:
    #   - "80:80"
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=futbolclub.duckdns.org      
      - LETSENCRYPT_HOST=futbolclub.duckdns.org 
      - LETSENCRYPT_EMAIL=atc757@inlumine.ual.es    
    depends_on:
      backend-node:
        condition: service_started
      gateway:
        condition: service_started
      corba-bridge:
        condition: service_started
    networks:
      - football-network

  corba-naming:
    build:
      context: ./backend-corba
      dockerfile: Dockerfile.naming
    container_name: football-corba-naming
    command: orbd -ORBInitialPort 1050 -ORBInitialHost 0.0.0.0
    networks:
      - football-network

  corba-server:
    build:
      context: ./backend-corba
      dockerfile: Dockerfile.corba
    container_name: football-corba-server
    environment:
      - ORB_HOST=corba-naming
    depends_on:
      - corba-naming
    networks:
      - football-network

  corba-bridge:
    build:
      context: ./backend-corba
      dockerfile: Dockerfile.bridge
    container_name: football-corba-bridge
    ports:
      - "8089:8080"
    environment:
      - ORB_HOST=corba-naming
      - FIREBASE_SERVICE_ACCOUNT=/app/firebase-credentials.json
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json
      - ./public_key.pem:/app/public.key
    depends_on:
      - corba-naming
      - corba-server
    networks:
      - football-network

  # --- REVERSE PROXY Y SSL (perfil "vm", no arranca en local) ---

  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    restart: always
    profiles: ["vm"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
    networks:
      - football-network

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: acme-companion
    restart: always
    profiles: ["vm"]
    environment:
      - DEFAULT_EMAIL=atc757@inlumine.ual.es
      - NGINX_PROXY_CONTAINER=nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
    depends_on:
      - nginx-proxy
    networks:
      - football-network

networks:
  football-network:
    driver: bridge

volumes:
  mongo-data:
  postgres-data:
