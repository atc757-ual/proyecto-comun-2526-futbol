server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para Backend Node.js
    location /node-api/ {
        proxy_pass http://backend-node:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para Backend Java (Gateway)
    location /java-api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para CORBA Bridge
    location /corba-api/ {
        proxy_pass http://corba-bridge:8080/corba-bridge/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # -------------------------------------------------------
    # DOCUMENTACIÓN Y DASHBOARDS (evidencia académica)
    # -------------------------------------------------------

    # Eureka Dashboard → https://futbolclub.duckdns.org/eureka/
    location /eureka/ {
        proxy_pass http://eureka-server:8761/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger — Gateway / IA → https://futbolclub.duckdns.org/docs/gateway/
    location /docs/gateway/ {
        proxy_pass http://gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger — Jugadores → https://futbolclub.duckdns.org/docs/players/
    location /docs/players/ {
        proxy_pass http://player-client:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger — Comentarios → https://futbolclub.duckdns.org/docs/comments/
    location /docs/comments/ {
        proxy_pass http://comment-client:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger — Usuarios → https://futbolclub.duckdns.org/docs/users/
    location /docs/users/ {
        proxy_pass http://user-client:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger — External Client (IA, Noticias, Geocodificación) → https://futbolclub.duckdns.org/docs/external/
    location /docs/external/ {
        proxy_pass http://external-client:8085/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }


    # CORBA Bridge API → https://futbolclub.duckdns.org/docs/corba/
    location /docs/corba/ {
        proxy_pass http://corba-bridge:8080/corba-bridge/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Dashboard de estado (Pug) del backend Node.js
    location /status {
        proxy_pass http://backend-node:3000/status;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # CSS del dashboard de estado (evita que lo tome el bloque de estáticos)
    location = /status.css {
        proxy_pass http://backend-node:3000/status.css;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cache de archivos estáticos y fuentes
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # MIME types correctos para fuentes (nginx:alpine usa tipos deprecados por defecto)
    location ~* \.(ttf|otf)$ {
        types { font/ttf ttf; font/otf otf; }
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
    location ~* \.(woff|woff2)$ {
        types { font/woff woff; font/woff2 woff2; }
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
