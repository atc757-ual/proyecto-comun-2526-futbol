<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fútbol Club — Splash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@700&display=swap" rel="stylesheet" crossorigin="anonymous">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      /* --color-neutral-0 */
      background: #FFFFFF;
      /* --font-primary */
      font-family: 'Barlow', sans-serif;
    }

    /* Réplica exacta de .splash-overlay */
    .splash-overlay {
      position: fixed;
      inset: 0;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Réplica exacta de .splash-center */
    .splash-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem; /* --space-base = 16px */
    }

    /* Réplica exacta de .splash-logo-circle */
    .splash-logo-circle {
      width: 100px;
      height: 100px;
      border-radius: 100%;           /* --border-radius-circle */
      background: #F3F5FF;           /* --blue-primary-010 (valor real del sistema) */
      display: flex;
      align-items: center;
      justify-content: center;
      /* sin animation: pulse → estático */
    }

    /* ion-icon con font-size: --fs-96 = 6rem = 96px */
    .splash-logo-circle svg {
      width: 96px;
      height: 96px;
      color: #002eff; /* --color-primary */
    }

    /* Réplica exacta de .splash-title */
    .splash-title {
      font-size: 1.5rem;   /* --fs-24 = 24px */
      font-weight: 700;    /* --fw-bold */
      font-family: 'Barlow', sans-serif; /* --font-primary */
      color: #002eff;      /* --color-primary */
      margin: 0;
      letter-spacing: -0.5px;
    }
  </style>
</head>
<body>

<div class="splash-overlay">
  <div class="splash-center">

    <!-- .splash-logo-circle  +  ion-icon name="football-outline" -->
    <div class="splash-logo-circle">
      <!-- SVG copiado literalmente de node_modules/ionicons/dist/svg/football-outline.svg -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <circle cx="256" cy="256" r="192" fill="none" stroke="currentColor"
                stroke-linecap="round" stroke-miterlimit="10" stroke-width="32"/>
        <path fill="none" stroke="currentColor" stroke-linecap="round"
              stroke-linejoin="round" stroke-width="32"
              d="M256 175.15l-76.09 63.83L200 320h112l20.09-81.02L256 175.15z
                 M332.09 238.98l52.87-22.4 25.78-73.26
                 M447 269.97l-62.04-53.39
                 M179.91 238.98l-52.87-22.4-25.78-73.26
                 M65 269.97l62.04-53.39
                 M256 175.15v-57.57l64-42.64
                 M192 74.93l64 42.65
                 M312 320l28 48-28 71
                 M410.74 368H342
                 M200 320l-28 48 28.37 71.5
                 M101.63 368H172"/>
      </svg>
    </div>

    <!-- h1.splash-title -->
    <h1 class="splash-title">Fútbol Club</h1>

  </div>
</div>

</body>
</html>
