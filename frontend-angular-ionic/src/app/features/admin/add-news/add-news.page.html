<ion-content [fullscreen]="true" class="ion-padding">
  <div class="add-news-container">
    
    <header class="header-section">
      <ion-back-button defaultHref="/news" text="Volver" mode="ios" class="margin-bottom-s"></ion-back-button>
      <h1>Redactar Noticia</h1>
      <p>Crea contenido de calidad para la comunidad futbolística.</p>
    </header>

    <div class="form-card">
      <form (ngSubmit)="onPublish()" #newsForm="ngForm">
        <div class="form-grid">
          
          <!-- Image Upload Placeholder -->
          <div class="image-upload-container" (click)="fileInput.click()">
            <div class="image-preview-wrapper">
              <img *ngIf="previewImage" [src]="previewImage" alt="Preview">
              <div *ngIf="!previewImage" class="upload-placeholder">
                <ion-icon name="cloud-upload-outline"></ion-icon>
                <span>Pulsa para cargar la imagen de portada</span>
                <p class="fs-12 text-neutral-5">Recomendado: 1920x1080px</p>
              </div>
              <ion-button *ngIf="previewImage" fill="clear" class="change-image-btn" (click)="$event.stopPropagation(); fileInput.click()">
                <ion-icon name="camera-outline" slot="start"></ion-icon>
                Cambiar
              </ion-button>
            </div>
            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" style="display: none;">
          </div>

          <!-- Title -->
          <div class="form-item full-width">
            <ion-input 
              label="Título de la Noticia" 
              labelPlacement="stacked" 
              [(ngModel)]="newsData.title" 
              name="title"
              required
              placeholder="Ej: El fichaje bomba de la temporada"
              class="custom-input"
            ></ion-input>
          </div>

          <!-- Category -->
          <div class="form-item">
            <ion-select 
              label="Categoría" 
              labelPlacement="stacked" 
              [(ngModel)]="newsData.category" 
              name="category"
              class="custom-input"
            >
              <ion-select-option value="Fichajes">Fichajes</ion-select-option>
              <ion-select-option value="Resultados">Resultados</ion-select-option>
              <ion-select-option value="Crónica">Crónica</ion-select-option>
              <ion-select-option value="Opinión">Opinión</ion-select-option>
              <ion-select-option value="Internacional">Internacional</ion-select-option>
              <ion-select-option value="General">General</ion-select-option>
            </ion-select>
          </div>

          <!-- Author -->
          <div class="form-item">
            <ion-input 
              label="Autor" 
              labelPlacement="stacked" 
              [(ngModel)]="newsData.author" 
              name="author"
              readonly
              class="custom-input"
            ></ion-input>
          </div>

          <!-- Summary -->
          <div class="form-item full-width">
            <ion-textarea 
              label="Resumen (Sumary)" 
              labelPlacement="stacked" 
              [(ngModel)]="newsData.summary" 
              name="summary"
              required
              minlength="10"
              maxlength="500"
              placeholder="Un breve resumen que enganche al lector..."
              class="custom-textarea"
              style="min-height: 100px;"
            ></ion-textarea>
          </div>

          <!-- Content -->
          <div class="form-item full-width">
            <ion-textarea 
              label="Contenido Completo" 
              labelPlacement="stacked" 
              [(ngModel)]="newsData.content" 
              name="content"
              required
              placeholder="Escribe aquí el cuerpo completo de la noticia..."
              class="custom-textarea"
              [autoGrow]="true"
            ></ion-textarea>
          </div>

          <!-- Tags -->
          <div class="form-item full-width">
            <ion-input 
              label="Tags (separados por coma)" 
              labelPlacement="stacked" 
              [(ngModel)]="tagInput" 
              (ionChange)="updateTags()"
              name="tags"
              placeholder="Ej: fichajes, laliga, realmadrid"
              class="custom-input"
            ></ion-input>
            <div class="tag-container">
              <ion-chip *ngFor="let tag of newsData.tags">
                <ion-label>{{ tag }}</ion-label>
              </ion-chip>
            </div>
          </div>

        </div>

        <div class="action-footer">
          <ion-button fill="clear" (click)="onCancel()" class="cancel-btn">
            Cancelar
          </ion-button>
          <ion-button 
            type="submit" 
            class="publish-btn" 
            shape="round" 
            [disabled]="!newsForm.form.valid || isPublishing"
          >
            <ion-spinner *ngIf="isPublishing" name="crescent"></ion-spinner>
            <span *ngIf="!isPublishing">Publicar Noticia</span>
          </ion-button>
        </div>
      </form>
    </div>

  </div>
</ion-content>
