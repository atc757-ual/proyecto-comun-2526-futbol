<!-- CARRUSEL DE NOTICIAS (SWIPER) -->
<div *ngIf="!isLoadingFeatured && featuredNews.length > 0" class="news-swiper-wrapper">
  <swiper-container #swiperRef navigation-prev-el=".custom-prev" navigation-next-el=".custom-next"
    [attr.loop]="featuredNews.length > 1 ? 'true' : 'false'" [attr.looped-slides]="featuredNews.length"
    pagination="true" pagination-clickable="true" observer="true" observe-parents="true" autoplay="true"
    autoplay-delay="3000" autoplay-disable-on-interaction="false" slides-per-view="1" space-between="0"
    class="featured-swiper">
    <swiper-slide *ngFor="let news of featuredNews">
      <div class="slide-content" [style.background-image]="'url(' + news.image + ')'">
        <div class="overlay-gradient"></div>
        <div class="news-info-overlay">
          <div class="news-badge-small">FÚTBOL</div>
          <div class="news-meta-overlay">
            <span class="source">{{ news.author }}</span>
            <span class="date">• {{ news.date }}</span>
          </div>
          <h2 class="news-title-overlay">{{ news.title }}</h2>
          <p class="news-excerpt-overlay">{{ news.excerpt }}</p>
          <div class="read-more-button" (click)="goToNewsDetail(news)">
            <span>Ver noticia</span>
            <ion-icon name="chevron-forward"></ion-icon>
          </div>
        </div>
      </div>
    </swiper-slide>
  </swiper-container>

  <!-- SKELETON LOADING -->
  <ng-container *ngIf="isLoadingFeatured && featuredNews.length === 0">
    <swiper-slide *ngFor="let item of [1,2,3]" class="skeleton-slide">
      <div class="skeleton-content">
        <ion-skeleton-text [animated]="true" style="width: 30%; height: 20px;"></ion-skeleton-text>
        <ion-skeleton-text [animated]="true" style="width: 60%;"></ion-skeleton-text>
        <ion-skeleton-text [animated]="true" style="width: 80%;"></ion-skeleton-text>
        <ion-skeleton-text [animated]="true" style="width: 100%; height: 100px;"></ion-skeleton-text>
        <ion-skeleton-text [animated]="true" style="width: 100px; height: 40px;"></ion-skeleton-text>
      </div>
    </swiper-slide>
  </ng-container>

  <!-- Navegación Externa Garantizada -->
  <div class="custom-swiper-button custom-prev">
    <ion-icon name="chevron-back"></ion-icon>
  </div>
  <div class="custom-swiper-button custom-next">
    <ion-icon name="chevron-forward"></ion-icon>
  </div>
</div>

<div class="row">
  <!-- COLUMNA 8: DETALLE (Primero en HTML -> Izquierda en Desktop) -->
  <div class="col-8 col-sm-12 pr-base px-0-sm">
    <ion-card class="card-acceso">
      <ion-card-content>
        <div class="card-acceso-item" routerLink="/add-news">
          <ion-icon class="fs-28" name="newspaper-outline" color="primary"></ion-icon>
          <ion-label class="f-regular text-neutral-8 fs-12">Crear Noticia</ion-label>
        </div>
        <div class="card-acceso-item" routerLink="/manage-news">
          <ion-icon class="fs-28" name="settings-outline" color="primary"></ion-icon>
          <ion-label class="f-regular text-neutral-8 fs-12">Gestionar Noticia</ion-label>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- COLUMNA 4: LISTADO (Después en HTML -> Derecha en Desktop) -->
  <div class="col-4 col-sm-12 pl-base px-0-sm">

  </div>

</div>
