<!-- SALUDO -->
<div class="">
  <h1 class="f-bold text-neutral-8 fs-28 fs-sm-18">¡Hola, Alex!</h1>
  <p class="text-neutral-7 f-medium fs-sm-16 mb-base">Bienvenido a tu aplicación de fútbol</p>
</div>
<!-- CARRUSEL DE NOTICIAS (SWIPER) -->
<div class="news-swiper-wrapper">
  <swiper-container #swiperRef navigation-prev-el=".custom-prev" navigation-next-el=".custom-next" loop="true"
    pagination="true" pagination-clickable="true" observer="true" observe-parents="true" autoplay="true"
    autoplay-delay="3000" autoplay-disable-on-interaction="false" slides-per-view="1" space-between="0"
    class="featured-swiper">
    <swiper-slide *ngFor="let news of featuredNews" (click)="goToNewsDetail(news)">
      <div class="slide-content" [style.background-image]="'url(' + news.image + ')'">
        <div class="overlay-gradient"></div>
        <div class="news-info-overlay">
          <div class="news-badge-small">FÚTBOL</div>
          <div class="news-meta-overlay">
            <span class="source">{{ news.author }}</span>
            <span class="date">• {{ news.date }}</span>
          </div>
          <h2 class="news-title-overlay">{{ news.title }}</h2>
          <p class="news-excerpt-overlay">{{ news.excerpt }}</p>
          <div class="read-more-button">
            <span>Ver noticia</span>
            <ion-icon name="chevron-forward"></ion-icon>
          </div>
        </div>
      </div>
    </swiper-slide>
  </swiper-container>

  <!-- Navegación Externa Garantizada -->
  <div class="custom-swiper-button custom-prev">
    <ion-icon name="chevron-back"></ion-icon>
  </div>
  <div class="custom-swiper-button custom-next">
    <ion-icon name="chevron-forward"></ion-icon>
  </div>
</div>

<div class="row">
  <!-- COLUMNA 8: DETALLE (Primero en HTML -> Izquierda en Desktop) -->
  <div class="col-8 col-sm-12 pr-base p-sm-0">
    <ion-card class="card-acceso">
      <ion-card-content>
        <div class="card-acceso-item">
          <div>
            <ion-icon class="fs-32" name="newspaper-outline" color="primary"></ion-icon>
          </div>
          <div>
            <ion-label class="f-medium text-primary fs-14">Gestionar Noticias</ion-label>
          </div>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- COLUMNA 4: LISTADO (Después en HTML -> Derecha en Desktop) -->
  <div class="col-4 col-sm-12 pl-base p-sm-0">

  </div>

</div>
