<div class="row">
  <!-- COLUMNA PRINCIPAL: Ahora ocupa más espacio para estirarse -->
  <div class="col-8 col-sm-12 pr-base px-0-sm">

    <!-- Cargando / Skeletons -->
    <div *ngIf="isLoading" class="news-grid">
      <ion-card *ngFor="let i of [1,2,3,4,5,6]" class="side-news-item skeleton-item">
        <ion-skeleton-text animated style="height: 160px; width: 100%;"></ion-skeleton-text>
        <div class="p-base">
          <ion-skeleton-text animated style="width: 80%; height: 20px;"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 60%; height: 16px;"></ion-skeleton-text>
        </div>
      </ion-card>
    </div>

    <!-- Grid de Noticias Estirado -->
    <div *ngIf="!isLoading && newsList.length > 0" class="news-grid animate-fade-in">
      <ion-card class="side-news-item clickable m-0 shadow-none" *ngFor="let news of newsList"
        (click)="goToDetail(news.id)">
        <div class="side-news-thumb">
          <img [src]="news.imageUrl" [alt]="news.title">
          <div class="category-pill">{{ news.category }}</div>
        </div>
        <div class="side-news-info">
          <h3 class="side-news-title">{{ news.title }}</h3>
          <p class="side-news-excerpt">{{ news.summary || news.content | slice:0:100 }}...</p>
          <div class="side-news-footer">
            <span class="side-news-author">{{ news.author }}</span>
            <span class="side-news-date">{{ news.date | date:'mediumDate' }}</span>
          </div>
        </div>
      </ion-card>
    </div>

    <!-- No hay noticias -->
    <div *ngIf="!isLoading && newsList.length === 0" class="empty-container">
      <ion-icon name="newspaper-outline"></ion-icon>
      <h2>No hay noticias todavía</h2>
      <p>Vuelve pronto para las últimas novedades del fútbol.</p>
    </div>
  </div>
  <!-- COLUMNA 4: LISTADO (Después en HTML -> Derecha en Desktop) -->
  <div class="col-4 col-sm-12 pl-base px-0-sm">
    <ion-card *ngIf="isAdmin">
      <ion-card-header>
        <ion-card-title class="fs-20 fs-sm-18 f-semibold">Opciones de administrador</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item [button]="true" lines="none" detail="true" class="action-item mb-s" [routerLink]="['/add-news']">
          <ion-icon aria-hidden="true" size="large" name="add-circle-outline" color="primary"></ion-icon>
          <ion-label class="ml-s">Crear noticia</ion-label>
        </ion-item>

        <div class="separator my-s"></div>

        <ion-item [button]="true" lines="none" detail="true" class="action-item" [routerLink]="['/manage-news']">
          <ion-icon aria-hidden="true" size="large" name="settings-outline" color="primary"></ion-icon>
          <ion-label class="ml-s">Gestionar noticias</ion-label>
        </ion-item>
      </ion-card-content>
    </ion-card>
  </div>

</div>
