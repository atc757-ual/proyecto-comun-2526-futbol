<!-- === 1. SI ES APP MÓVIL: Usa el nuevo diseño nativo === -->
<div *ngIf="platformService.isMobileApp" class="mobile-wrapper" id="mobile-main-content">

  <!-- NATIVE-LIKE MOBILE HEADER -->
  <ion-header mode="md" class="mobile-header ion-no-border">
    <ion-toolbar class="mobile-toolbar content-container">
      <ion-buttons slot="start">
        <ng-container *ngIf="isCurrentHome(); else showBack">
          <ion-menu-toggle>
            <ion-button class="menu-btn-minimal">
              <ion-icon slot="icon-only" name="menu-outline"></ion-icon>
            </ion-button>
          </ion-menu-toggle>
        </ng-container>
        <ng-template #showBack>
          <button (click)="goBack()" class="back-btn-minimal" aria-label="Volver atrás">
            <ion-icon name="arrow-back"></ion-icon>
          </button>
        </ng-template>
      </ion-buttons>

      <ion-title class="mobile-title">
        <div class="logo-box clickable" [class.centered]="!isCurrentHome()">
          <div class="logo-ball-blue">
            <ion-icon name="football"></ion-icon>
          </div>
          <span class="main-logo-text">Fútbol Club</span>
        </div>
      </ion-title>

      <ion-buttons class="auth-actions" slot="end">
        <a routerLink="/profile" class="auth-btn clickable">
          <ion-icon name="person-circle-outline" color="primary"></ion-icon>
        </a>
        <a (click)="logout()" class="auth-btn clickable">
          <ion-icon name="log-out-outline" color="primary"></ion-icon>
        </a>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <!-- CONTENT -->
  <div class="layout-router-container pb-xl">
    <ion-router-outlet [animated]="false"></ion-router-outlet>
  </div>

  <!-- PESTAÑAS MÓVILES -->
  <app-layout-tabs [appPages]="appPages"></app-layout-tabs>
</div>

<!-- === 2. SI ES WEB O ESCRITORIO: Usa tu diseño actual === -->
<ng-container *ngIf="!platformService.isMobileApp">
  <!-- MENU LATERAL (Renderiza el menú en escritorio) -->
  <app-layout-navigation [appPages]="appPages" (logoutAction)="logout()"></app-layout-navigation>

  <!-- GLOBAL AI THINKING OVERLAY -->
  <div *ngIf="layoutService.aiLoading()" class="ai-thinking-overlay animate-fade-in">
    <div class="ai-core-container">
      <div class="ai-core-orb"></div>
      <div class="ai-core-ring"></div>
      <div class="ai-core-ring delay-1"></div>
      <div class="ai-core-ring delay-2"></div>
    </div>
    <h2 class="ai-thinking-text">{{ layoutService.aiThinkingText() }}</h2>
    <p class="ai-thinking-subtext">Procesando tus datos en servidores neurales</p>
  </div>

  <div class="main-wrapper" id="main-content">

    <!-- DESKTOP TOP HEADER -->
    <header class="main-header" [class.no-border]="layoutService.showHero()">
      <!-- FILA 1: Top Branding & Actions -->
      <div class="top-header-row">
        <div class="main-content header">
          <div class="header-left">
            <!-- Botón Menú (Hamburguesa) -->
            <ion-menu-toggle *ngIf="platformService.isWebMobile">
              <ion-icon name="menu-outline"
                class="burger-icon hide-on-desktop clickable mr-s menu-btn-minimal"></ion-icon>
            </ion-menu-toggle>

            <div *ngIf="platformService.isDesktop  || (platformService.isMobileApp && layoutService.isHome())"
              class="logo-box clickable" routerLink="/home">
              <div class="d-flex gap-s ai-center">
                <span class="logo-ball-blue">
                  <ion-icon name="football"></ion-icon>
                </span>
                <span class="main-logo-text">Fútbol Club</span>
              </div>
            </div>
          </div>

          <div class="header-center">
            <!-- Balón Azul Centrado -->
            <div *ngIf="platformService.isWebMobile || (!layoutService.isHome() && platformService.isMobileApp)"
              class="header-center-icon hide-on-desktop">
              <div routerLink="/home" class="central-ball-wrapper">
                <ion-icon name="football"></ion-icon>
              </div>
              <ion-label class="central-text-wrapper">Fútbol Club</ion-label>
            </div>
          </div>

          <div class="header-right" slot="end">
            <div class="auth-actions">
              <a class="auth-btn clickable" routerLink="/profile">
                <ion-icon name="person-circle-outline"></ion-icon>
                <span class="ml-xs hide-on-phone">Mi Perfil</span>
              </a>
              <a class="auth-btn logout clickable" (click)="logout()">
                <ion-icon name="log-out-outline"></ion-icon>
                <span class="ml-xs hide-on-phone">Cerrar Sesión</span>
              </a>
            </div>
          </div>

        </div>
      </div>

      <!-- FILA 2: Navegación Central (Solo en Desktop) -->
      <nav *ngIf="platformService.isDesktop" class="nav-header-row">
        <div class="main-content content">
          <ul class="nav-links-centered">
            <ng-container *ngFor="let p of appPages">
              <li [routerLink]="p.url" [class.active]="isTabActive(p.url)"
                [class.nav-item-ai]="p.title === 'Fútbol AI'">
                <ion-icon
                  *ngIf="p.icon !== 'home' && p.icon !== 'people' && p.icon !== 'cart' && p.icon !== 'newspaper'"
                  [name]="p.icon" class="nav-icon-mini"></ion-icon>
                {{ p.title }}
              </li>
            </ng-container>
          </ul>
        </div>
      </nav>
    </header>

    <!-- MAIN CONTENT -->
    <div class="layout-router-container pb-xl">
      <ion-router-outlet [animated]="false"></ion-router-outlet>
    </div>
  </div>
</ng-container>
