<ion-menu *ngIf="!isMobileApp" contentId="main-content" class="mobile-only-menu" side="start" mode="ios">
  <ion-content class="ion-no-padding" scroll-y="false">
    <div class="menu-wrapper">
      <div class="menu-header d-flex align-center justify-between px-base">
        <div class="logo-container">
          <span class="logo-text">Football App</span>
          <div class="logo-circle-wrapper">
            <ion-icon name="football" class="logo-icon"></ion-icon>
          </div>
        </div>
        <ion-menu-toggle>
          <ion-button fill="none" class="close-menu-btn">
            <ion-icon slot="icon-only" size="large" name="close-outline"></ion-icon>
          </ion-button>
        </ion-menu-toggle>
      </div>

      <div class="menu-options-container">
        <!-- SECCIÓN SUPERIOR: NAVEGACIÓN -->
        <div class="menu-items-top">
          <ion-menu-toggle auto-hide="false" *ngFor="let p of appPages">
            <ion-item lines="none" class="nav-item pointer" [routerLink]="p.url" routerLinkActive="active-item"
              [routerLinkActiveOptions]="{exact: true}">
              <ion-icon slot="start" [name]="p.icon"></ion-icon>
              <ion-label>{{ p.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </div>

        <!-- ESPACIADOR (Empuja lo de abajo hacia el final) -->
        <div class="menu-spacer"></div>

        <!-- SECCIÓN INFERIOR: CUENTA -->
        <div class="menu-items-bottom">
          <div class="menu-divider"></div>

          <ion-menu-toggle auto-hide="false">
            <ion-item lines="none" class="nav-item profile-item pointer" routerLink="/profile"
              routerLinkActive="active-item">
              <ion-icon slot="start" name="person-circle-outline"></ion-icon>
              <ion-label>Mi Perfil</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-menu-toggle auto-hide="false">
            <ion-item lines="none" class="nav-item logout-item pointer" (click)="logout()">
              <ion-icon slot="start" name="log-out-outline"></ion-icon>
              <ion-label>Cerrar Sesión</ion-label>
            </ion-item>
          </ion-menu-toggle>
        </div>
      </div>
    </div>
  </ion-content>
</ion-menu>

<div class="main-wrapper" id="main-content">
  <!-- HEADER PREMIUM (DOS FILAS) -->
  <header class="main-header" [class.no-border]="showHero">
    <!-- FILA 1: Top Branding & Actions -->
    <div class="top-header-row">
      <div class="main-content header">
        <div class="header-left">
          <!-- Botón Menú (Hamburguesa) - FUERA del logo para que no navegue solo -->
          <ion-menu-toggle *ngIf="isWebMobile">
            <ion-icon name="menu-outline" class="burger-icon hide-on-desktop clickable mr-s"></ion-icon>
          </ion-menu-toggle>
          <div class="logo-box clickable" routerLink="/home">
            <div class="d-flex gap-s fl-align-center">
              <span class="logo-ball-blue">
                <ion-icon name="football"></ion-icon>
              </span>
              <span class="main-logo-text">Football App</span>
            </div>
          </div>
        </div>

        <!-- Balón Azul Centrado -->
        <div *ngIf="isWebMobile" class="header-center-icon">
          <div class="central-ball-wrapper">
            <ion-icon name="football"></ion-icon>
          </div>
          <ion-label class="central-text-wrapper">Football App</ion-label>
        </div>

        <div class="header-right">
          <div *ngIf="!isWebMobile" class="auth-actions">
            <a class="auth-btn clickable" routerLink="/profile">
              <ion-icon name="person-circle-outline"></ion-icon>
              <span class="hide-on-phone">Mi Perfil</span>
            </a>
            <a class="auth-btn logout clickable">
              <ion-icon name="log-out-outline"></ion-icon>
              <span class="hide-on-phone">Cerrar Sesión</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- FILA 2: Navegación Central (Solo en Desktop) -->
    <nav *ngIf="isDesktop" class="nav-header-row">
      <div class="main-content content">
        <ul class="nav-links-centered">
          <li routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</li>
          <li routerLink="/players" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Jugadores</li>
          <li routerLink="/ai-team" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
            class="nav-item-ai">
            <ion-icon name="sparkles" class="nav-icon-mini"></ion-icon>IA
          </li>
          <li routerLink="/player-add" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Mercado
          </li>
          <li routerLink="/news" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Noticias</li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <ion-content class="main-main-bg" [scrollY]="true">

    <!-- SECCIÓN HERO FULL WIDTH (Re-integrado en el Layout) -->
    <section *ngIf="showHero" class="layout-hero-banner">
      <div class="main-content">
        <div class="hero-title">{{ heroTitle }}</div>
        <div class="hero-subtitle" *ngIf="heroSubtitle">{{ heroSubtitle }}</div>
      </div>
    </section>

    <div class="main-content content">
      <router-outlet></router-outlet>
    </div>

    <!-- DESKTOP FOOTER (Se ve en Web, incluso móvil) -->
    <footer *ngIf="!isMobileApp" class="main-footer-gray">
      <div class="main-content footer">
        <div class="footer-slim-content">
          <div class="footer-left">
            <span class="copyright-text fs-14 text-neutral-7">© 2026 Football App. By Alex Taquila.</span>
          </div>
          <div class="footer-right">
            <div class="footer-socials">
              <span class="fs-14 text-neutral-7 hide-on-phone">Sígueme en:</span>
              <a href="https://www.linkedin.com/in/alextaquilacamasca/" target="_blank" class="social-icon">
                <ion-icon name="logo-linkedin"></ion-icon>
              </a>
              <a href="https://github.com/atc757-ual/proyecto-comun-2526-futbol" target="_blank" class="social-icon">
                <ion-icon name="logo-github"></ion-icon>
              </a>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </ion-content>

  <!-- MOBILE BOTTOM BAR (Solo se ve en App Móvil) -->
  <ion-footer *ngIf="isMobileApp" class="hide-on-desktop main-app-footer ion-no-border">
    <ion-tab-bar slot="bottom" class="tab-bar-clean">

      <ion-tab-button *ngFor="let p of appPages; let i = index" [tab]="p.title" [routerLink]="p.url"
        routerLinkActive="tab-selected" [routerLinkActiveOptions]="{exact: true}" [class.ai-tab-special]="i === 2">

        <!-- Icono normal para todos menos el tercero -->
        <ion-icon *ngIf="i !== 2" [name]="p.icon"></ion-icon>

        <!-- Estructura especial para el botón central de IA -->
        <div *ngIf="i === 2" class="ai-icon-circle">
          <ion-icon [name]="p.icon"></ion-icon>
        </div>

        <ion-label>{{ p.title }}</ion-label>
      </ion-tab-button>

    </ion-tab-bar>
  </ion-footer>
</div>
