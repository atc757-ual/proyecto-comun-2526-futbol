<!-- === 1. SI ES APP MÓVIL: Usa el nuevo diseño nativo === -->
<div *ngIf="platformService.isMobileApp" class="mobile-wrapper" id="mobile-public-content">
  <!-- NATIVE-LIKE MOBILE HEADER -->
  <ion-header mode="md" class="mobile-header ion-no-border">
    <ion-toolbar class="mobile-toolbar content-container">
      <ion-buttons slot="start">
        <button (click)="goBack()" class="back-btn-minimal" aria-label="Volver atrás">
          <ion-icon name="arrow-back"></ion-icon>
        </button>
      </ion-buttons>

      <ion-title class="mobile-title">
        <div class="logo-box centered clickable">
          <div class="logo-ball-blue">
            <ion-icon name="football"></ion-icon>
          </div>
          <span class="main-logo-text">Fútbol Club</span>
        </div>
      </ion-title>

      <ion-buttons class="auth-actions" slot="end">
        <ng-container *ngIf="!authService.userData()">
          <a (click)="goTo('/auth/login')" class="auth-btn clickable">
            <ion-icon name="log-in-outline" color="primary"></ion-icon>
            <span class="hide-on-phone">Iniciar Sesión</span>
          </a>
          <a (click)="goTo('/auth/register')" class="auth-btn clickable">
            <ion-icon name="person-add-outline" color="primary"></ion-icon>
            <span class="hide-on-phone">¡Regístrate!</span>
          </a>
        </ng-container>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <!-- CONTENT -->
  <div class="layout-router-container pb-xl">
    <ion-router-outlet [animated]="false"></ion-router-outlet>
  </div>
  <!-- MOBILE BOTTOM BAR -->
  <ion-footer class="mobile-tab-footer ion-no-border">
    <ion-tab-bar slot="bottom" class="mobile-tab-bar">
      <ng-container *ngFor="let p of appPages; let i = index">
        <ion-tab-button [tab]="p.title" [class.tab-selected]="isTabActive(p.url)" [class.ai-tab-special]="i === 2"
          (click)="onTabClick($event, p, i)">

          <ion-icon *ngIf="i !== 2" [name]="p.icon"></ion-icon>

          <div *ngIf="i === 2" class="ai-icon-circle">
            <ion-icon [name]="p.icon"></ion-icon>
          </div>

          <ion-label *ngIf="i !== 2">{{ p.title }}</ion-label>
        </ion-tab-button>
      </ng-container>
    </ion-tab-bar>
  </ion-footer>
</div>


<!-- === 2. SI ES WEB O ESCRITORIO: Usa tu diseño actual === -->
<ng-container *ngIf="!platformService.isMobileApp">
  <div class="main-wrapper overflow-y-auto" id="public-content">
    <!-- HEADER PREMIUM (CLON DE MAIN) -->
    <header class="main-header" [class.no-border]="layoutService.showHero()">
      <!-- FILA 1: Branding y Perfil -->
      <div class="top-header-row">
        <div class="main-content header">
          <div class="header-left">
            <ion-button *ngIf="platformService.isMobileApp" (click)="goBack()" class="back-link-minimal"
              aria-label="Volver atrás">
              <ion-icon name="arrow-back"></ion-icon>
            </ion-button>

            <!-- Logo a la Izquierda -->
            <div class="logo-box clickable" (click)="onLogoClick($event)">
              <div class="logo-ball-blue">
                <ion-icon name="football"></ion-icon>
              </div>
              <span class="main-logo-text">Fútbol Club</span>
            </div>
          </div>

          <div class="header-right">
            <div class="auth-actions">
              <!-- Caso: Usuario NO está logueado -->
              <ng-container *ngIf="!authService.userData()">
                <a (click)="goTo('/auth/login')" class="auth-btn clickable">
                  <ion-icon name="log-in-outline" color="primary"></ion-icon>
                  <span class="hide-on-phone">Iniciar Sesión</span>
                </a>
                <a (click)="goTo('/register')" class="auth-btn clickable">
                  <ion-icon name="person-add-outline" color="primary"></ion-icon>
                  <span class="hide-on-phone">¡Regístrate!</span>
                </a>
              </ng-container>

              <ng-container *ngIf="authService.userData()">
                <a (click)="goTo('/profile')" class="auth-btn clickable">
                  <ion-icon name="person-circle-outline" color="primary"></ion-icon>
                  <span class="hide-on-phone">Mi Perfil</span>
                </a>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </header>
    <!-- MAIN CONTENT -->
    <div class="layout-router-container pb-xl">
      <ion-router-outlet [animated]="false"></ion-router-outlet>
    </div>
  </div>
</ng-container>
