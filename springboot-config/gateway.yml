spring:
  cloud:
    gateway:
      routes:
        # Java Player Microservice
        - id: player-client-route
          uri: lb://PLAYER-CLIENT
          predicates:
            - Path=/api/players, /api/players/**

        # Java Comment Microservice
        - id: comment-client-route
          uri: lb://COMMENT-CLIENT
          predicates:
            - Path=/api/comments, /api/comments/**

        # Java External Football Proxy (Feign)
        - id: external-feign-route
          uri: lb://EXTERNAL-FEIGN
          predicates:
            - Path=/api/external/football/**
          filters:
            - RewritePath=/api/external/football/(?<segment>.*), /api/external/players/${segment}

        # Java External Client (Orchestrator, AI, TV, Live, Players etc)
        - id: external-client-route
          uri: lb://EXTERNAL-CLIENT
          predicates:
            - Path=/api/external/**

        # Java News Microservice (delegated to external-client)
        - id: news-client-route
          uri: lb://EXTERNAL-CLIENT
          predicates:
            - Path=/api/news, /api/news/**

        # Java Geocoding Service (delegated to external-client)
        - id: geocoding-route
          uri: lb://EXTERNAL-CLIENT
          predicates:
            - Path=/api/geo, /api/geo/**

eureka:
  client:
    service-url:
      defaultZone: http://football-eureka-server:8761/eureka/

google:
  api:
    key: ${GOOGLE_API_KEY}

app:
  cors:
    allowed-origins: "http://localhost,http://localhost:4200,http://localhost:8100,http://35.255.218.37,https://futbolclub.duckdns.org"
